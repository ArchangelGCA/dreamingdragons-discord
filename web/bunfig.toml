# Bun 1.4 configuration for the SvelteKit dashboard
[install]
frozenLockfile = false

[install.cache]
# use default

[run]
bun = true

# `bun fmt` (Bun 1.4.4+) — built-in Prettier-compatible formatter.
# Matches the SvelteKit default style (tabs, single quotes, no trailing commas).
[fmt]
useTabs = true
singleQuote = true
trailingComma = "none"
printWidth = 100
