# dd-bot full stack: PocketBase + Discord bot + admin dashboard (+ optional Cloudflare Tunnel).
# Quick start:  cp .env.example .env  &&  docker compose up -d --build
# With tunnel:  docker compose --profile tunnel up -d --build

services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    container_name: ddbot-pocketbase
    restart: unless-stopped
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
    volumes:
      - pb_data:/pb/pb_data
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddbot-bot
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      # Internal API bridge for the dashboard. NO `ports:` mapping — reachable only
      # on the internal Docker network at http://bot:${BOT_API_PORT}, never from the host.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BOT_API_PORT=${BOT_API_PORT:-8787}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ddbot-web
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
      bot:
        condition: service_started
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - PORT=3000
      # Server-side bridge to the bot's internal API (names + Discord actions).
      # Must share the same secret as the bot; host/port must match BOT_API_PORT.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BOT_API_URL=http://bot:${BOT_API_PORT:-8787}
    ports:
      - "${WEB_PORT:-3000}:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ddbot-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  pb_data:
