# dd-bot full stack: PocketBase + Discord bot + admin dashboard (+ optional Cloudflare Tunnel).
# Quick start:  cp .env.example .env  &&  docker compose up -d --build
# With tunnel:  docker compose --profile tunnel up -d --build

services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    container_name: ddbot-pocketbase
    restart: unless-stopped
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
    volumes:
      - pb_data:/pb/pb_data
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddbot-bot
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      # Internal API bridge for the dashboard. NO `ports:` mapping — reachable only
      # on the internal Docker network at http://bot:${BOT_API_PORT}, never from the host.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BOT_API_PORT=${BOT_API_PORT:-8787}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ddbot-web
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
      bot:
        condition: service_started
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - PORT=3000
      # Server-side bridge to the bot's internal API (names + Discord actions).
      # Must share the same secret as the bot; host/port must match BOT_API_PORT.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BOT_API_URL=http://bot:${BOT_API_PORT:-8787}
    ports:
      - "${WEB_PORT:-3000}:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ddbot-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web

  # Continuous deployment: polls the git remote and rebuilds the stack in place
  # when new commits land — no GitHub Actions needed. Inert until AUTO_UPDATE=true.
  # It drives Docker via the mounted socket (root-equivalent host access — see
  # README "Automatic updates"). It never touches named volumes, so data is safe.
  updater:
    build:
      context: ./deploy/updater
    container_name: ddbot-updater
    restart: unless-stopped
    environment:
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      - AUTO_UPDATE_INTERVAL=${AUTO_UPDATE_INTERVAL:-300}
      - AUTO_UPDATE_BRANCH=${AUTO_UPDATE_BRANCH:-master}
      - AUTO_UPDATE_REMOTE=${AUTO_UPDATE_REMOTE:-origin}
      # Only needed for PRIVATE repos (GitHub PAT / fine-grained token). Leave blank for public.
      - GIT_PULL_TOKEN=${GIT_PULL_TOKEN:-}
      # Auto-detected from this container's compose labels; set only to override.
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-}
      # Pass through active profiles (e.g. "tunnel") so the updater manages the same services.
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
    volumes:
      # Drive the host Docker daemon (build/recreate the sibling containers).
      - /var/run/docker.sock:/var/run/docker.sock
      # The repo itself — read for git pull, and the compose file / build contexts.
      - .:/repo
    working_dir: /repo

volumes:
  pb_data:
